<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fact Family Fun</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--tx:#2b2b3a;--pr:#6c4cf1;--ok:#2e9e5b;--no:#e8903a;--bd:#e3d9c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2e;--card:#2a2744;--tx:#f4f1ff;--pr:#8f78ff;--ok:#3cc47a;--no:#f0a24f;--bd:#443f6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1b2e;--card:#2a2744;--tx:#f4f1ff;--pr:#8f78ff;--ok:#3cc47a;--no:#f0a24f;--bd:#443f6b;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;text-align:center}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:2rem;margin:8px 0}
.card{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:18px;margin:12px 0}
.bar{display:flex;justify-content:space-between;font-size:1.4rem;font-weight:700}
.q{font-size:1.7rem;font-weight:700;line-height:1.4;min-height:130px;display:flex;flex-direction:column;justify-content:center}
.dots{font-size:1.5rem;line-height:1.5;margin-top:6px}
.o{display:grid;gap:12px;margin:12px 0}
.b{width:100%;font:inherit;font-size:2rem;font-weight:700;padding:18px;border:0;border-radius:20px;background:var(--pr);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.b:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.b.ok{background:var(--ok)}.b.no{background:var(--no)}
.f{font-size:1.3rem;min-height:70px;font-weight:700}
.big{font-size:3rem;margin:8px 0}
[hidden]{display:none!important}
</style></head><body><main>
<h1>🌟 Fact Family Fun</h1>
<section id="s" class="card">
<div class="big">✖️ ➗ 🎈</div>
<p style="font-size:1.4rem">Answer 20 questions about multiplication, division and multiples of 2, 5 and 10. Win a star for each right answer!</p>
<button class="b" id="go">Let’s play! ▶</button>
</section>
<section id="g" hidden>
<div class="bar"><span id="sc">⭐ 0</span><span id="tm">⏱ 0:00</span><span id="pg">1/20</span></div>
<div class="card"><div id="q" class="q"></div></div>
<div id="o" class="o"></div>
<div id="f" class="f"></div>
<button id="n" class="b" hidden>Next ➜</button>
</section>
<section id="e" class="card" hidden>
<div class="big" id="st"></div>
<h2 id="ms"></h2>
<p style="font-size:1.4rem" id="sm"></p>
<button class="b" id="again">Play again 🔄</button>
</section>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
var shuf=function(a){return a.map(function(x){return[Math.random(),x]}).sort(function(p,q){return p[0]-q[0]}).map(function(x){return x[1]})};
var pick1=function(a){return a[R(0,a.length-1)]};
var Q=[],i=0,score=0,locked=false;
function nums(ans){var s=[ans];while(s.length<3){var v=Math.max(1,ans+R(-4,4));if(s.indexOf(v)<0)s.push(v)}return shuf(s).map(String)}
function make(){
 var t=R(0,6),a,b,p;
 if(t==0){a=pick1([2,3,4,5,10]);b=R(2,5);p=a*b;var rows="";for(var r=0;r<b;r++){rows+=("🟣 ".repeat(a))+"<br>"}
  return{t:b+" rows of "+a+" dots.<div class='dots'>"+rows+"</div>"+b+" × "+a+" = ?",o:nums(p),a:String(p),h:"Count in "+a+"s, "+b+" times."}}
 if(t==1){a=pick1([2,3,4,5,10]);b=R(2,9);p=a*b;
  return{t:a+" × "+b+" = "+p+"<br>so "+p+" ÷ "+a+" = ?",o:nums(b),a:String(b),h:"Division undoes multiplication."}}
 if(t==2){a=pick1([2,3,4,5,10]);b=R(2,10);p=a*b;
  return{t:p+" ÷ "+a+" = ?",o:nums(b),a:String(b),h:"Think: "+a+" × ? = "+p+"."}}
 if(t==4){a=pick1([2,3,4,5,10]);b=R(2,9);p=a*b;var tf=Math.random()<.5,sh=tf?b:b+pick1([-1,1,2]);return{t:"True or false?<br>"+p+" ÷ "+a+" = "+sh,o:["True ✅","False ❌"],a:tf?"True ✅":"False ❌",h:"Check: "+a+" × "+b+" = "+p+"."}}
 if(t==5){a=pick1([2,3,4,5,10]);b=R(2,9);p=a*b;return{t:"Complete the fact family:<br>"+a+" × "+b+" = "+p+"<br>"+b+" × "+a+" = "+p+"<br>"+p+" ÷ "+a+" = "+b+"<br>"+p+" ÷ "+b+" = ?",o:nums(a),a:String(a),h:"Division undoes multiplication: "+b+" × ? = "+p+"."}}
 var tp={2:"Multiples of 2 are even numbers.",5:"Multiples of 5 end in 0 or 5.",10:"Multiples of 10 end in 0."};
 if(t==6){var bs=pick1([2,5,10]),m=Math.random()<.5,n;if(m){n=bs*R(2,19)}else{do{n=R(11,99)}while(n%bs===0)}return{t:"Is "+n+" a multiple of "+bs+"?",o:["Yes 👍","No 👎"],a:m?"Yes 👍":"No 👎",h:tp[bs]}}
 var base=pick1([2,5,10]),c=base*R(2,12),w=[];
 while(w.length<2){var x=R(2,120);if(x%base!==0&&w.indexOf(x)<0)w.push(x)}
 var tip={2:"Multiples of 2 are even numbers.",5:"Multiples of 5 end in 0 or 5.",10:"Multiples of 10 end in 0."}[base];
 return{t:"Which number is a multiple of "+base+"?",o:shuf([c,w[0],w[1]]).map(String),a:String(c),h:tip}}
var tI,t0;function tick(){var s=Math.floor((Date.now()-t0)/1000);$("tm").textContent="⏱ "+Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function start(){clearInterval(tI);t0=Date.now();tick();tI=setInterval(tick,1000);Q=[];for(var k=0;k<20;k++)Q.push(make());i=0;score=0;locked=false;$("s").hidden=true;$("e").hidden=true;$("g").hidden=false;$("sc").textContent="⭐ 0";show()}
function show(){var c=Q[i];$("pg").textContent=(i+1)+"/20";$("q").innerHTML=c.t;$("f").textContent="";$("n").hidden=true;$("o").innerHTML="";
 c.o.forEach(function(v){var b=document.createElement("button");b.className="b";b.textContent=v;b.onclick=function(){choose(b,v)};$("o").appendChild(b)})}
function choose(b,v){if(locked)return;locked=true;var c=Q[i];
 if(v===c.a){score++;b.classList.add("ok");$("sc").textContent="⭐ "+score;$("f").textContent=pick1(["Brilliant! 🎉","Well done! 🌟","Super! 👏","You got it! ⭐"])}
 else{b.classList.add("no");Array.prototype.forEach.call($("o").children,function(x){if(x.textContent===c.a)x.classList.add("ok")});$("f").textContent="Nice try! 💪 "+c.h+" The answer is "+c.a+"."}
 $("n").textContent=i==19?"See my stars ➜":"Next ➜";$("n").hidden=false}
$("n").onclick=function(){i++;if(i>=20){end()}else{locked=false;show()}};
function end(){$("g").hidden=true;clearInterval(tI);$("e").hidden=false;$("st").textContent="⭐".repeat(Math.ceil(score/4))||"🌱";
 $("ms").textContent=score>=18?"Superstar! 🏆":score>=12?"Great job! 🎉":"Good try! Keep practising! 💪";
 $("sm").textContent="You scored "+score+" out of 20 in "+$("tm").textContent.slice(2)+"."}
$("go").onclick=start;$("again").onclick=start;
</script></body></html>
